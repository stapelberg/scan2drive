; scan2drive M5Stack UI — M5Unified port.
;
; Setup:
;   cp include/secrets.h.example include/secrets.h
;   $EDITOR include/secrets.h
; Build & flash:
;   pio run -t upload
; Serial monitor:
;   pio device monitor

[env:m5stack-core-esp32]
platform = espressif32
board = m5stack-core-esp32
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Don't reset the chip when opening the serial monitor.
monitor_dtr = 0
monitor_rts = 0

upload_speed = 921600

lib_deps =
    m5stack/M5Unified@^0.2.0
    knolleary/PubSubClient@^2.8
